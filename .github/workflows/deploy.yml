name: Build (and deploy to Pages)

# Builds web/ and publishes it. The pipeline does NOT run here: the data is
# committed, so a deploy is a pure build of what is already in the repository.
# That is deliberate — CI reaching out to TÜİK and YSK on every push would be
# both impolite and a way to get a different site from the same commit.
#
# To refresh the data, run the pipeline locally and commit the result. The diff
# is the review.
#
# Pull requests prove a proposed change builds. Only main deploys; no feature
# branch can publish the public site.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile, so
      # a transitive release cannot change what gets deployed.
      - run: npm ci
        working-directory: web

      - run: npx tsc --noEmit
        working-directory: web

      # A project site is served from /<repo>/, so the build needs that prefix.
      # Derived from the repository name rather than hardcoded, so a rename or a
      # fork does not silently ship a site whose assets all 404.
      - name: Build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
