# provinces.yaml — the 81 il, and the codes every publisher keys on.
#
# plaka      the vehicle plate number, 1..81. Natural Earth's iso_3166_2 is
#            TR-<plaka>, and YSK's il_ID is the same number, so it is this
#            project's join key and the id of every province on the map.
# nuts3      TÜİK's İBBS level-3 code, which its workbooks key on instead.
# name_tr    as the map publishes it; name_en likewise.
# name_tuik  present only where TÜİK spells the name differently. Two do:
#            TÜİK writes Elazığ and Hakkari where the map writes Elâzığ and
#            Hakkâri. Recorded rather than folded away, because an accent
#            fold that is right for these two could quietly merge others,
#            and a silently dropped province is a hole in every overlay.
#
# Built 2026-09-20 from Natural Earth admin-1 and TÜİK's own workbook, and
# checked both ways: 81 names on each side, none unmatched.

