title: "İstanbul's metro, tram, funicular, cable car and ferry network, as İBB publishes it"
group: transit
order: 10
builder: atlas.datasets.istanbul_transit:build
params: {}
sources:
- ibb_gtfs
shells:
- fetcher
- geometry
after: []
outputs:
- data/transit/istanbul.json
frame:
