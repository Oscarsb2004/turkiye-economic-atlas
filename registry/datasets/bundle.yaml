# registry/datasets/bundle.yaml - the bundle the site fetches.
# `python -m atlas.run bundle` builds it; atlas/core/registry.py checks every claim below.

title: What the site reads that is generated rather than published — meta, palette and the election index
group: bundle
order: 10
builder: atlas.export.bundle:build
params: {}
sources:
- dhmi_airport_statistics
- nasa_gibs
- ibb_gtfs
- natural_earth_admin1
- geoboundaries_adm1
- boc_valet
- osm_overpass
- ourairports
- tuik_provincial_gdp   # meta.json publishes each source and its licence
- tuik_internal_migration
- ysk_election_results
shells: []
after: []
outputs:
- web/public/data/elections/index.json
- web/public/data/meta.json
- web/public/data/palette.json
frame: null
on_screen: true
consumed_by:
- path: web/src/data/bundle.ts
  how: the app fetches meta.json, palette.json and the election index; every dataset file it reads is served from data/ (web/vite.config.ts)
