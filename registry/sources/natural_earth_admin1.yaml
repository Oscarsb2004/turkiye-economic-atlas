# registry/sources/natural_earth_admin1.yaml — one source this project reads.
# The file name is the source's key; its licence is defined in registry/licences.yaml.

title: Natural Earth admin-1 (states and provinces, 1:10m)
publisher: Natural Earth
licence: public-domain
attribution: Natural Earth (public domain)
page: https://www.naturalearthdata.com/downloads/10m-cultural-vectors/
# The 81 il, pinned at tag v5.1.2 and built into web/public/geo/provinces.json by
# scripts/build_geo.mjs, which records every command it ran in SOURCES.json.
#
# Named as a source card because a dataset now DEPENDS on those boundaries
# rather than merely drawing them: a station's province is the province whose
# published boundary contains its published coordinate, and the card is what
# says whose boundary that is.
#
# Türkiye's own TUCBS geodata forbids redistribution, which is why the
# boundaries here are Natural Earth's (docs/PLAN.md).
