# airports.yaml — the crosswalk between what DHMİ prints and what everyone else keys on.
#
# DHMİ publishes its traffic tables with the airport's NAME in the first column
# and no code of any kind. OurAirports publishes coordinates, the IATA code and
# the province (its iso_region IS TR-<plaka>) against the ICAO code. So one
# thing has to be matched by hand, once, and written down: DHMİ's name ->
# the ICAO code.
#
# Nothing else lives here. The coordinates, the English name, the IATA code and
# the province all come from OurAirports at build time, so this file cannot
# drift from a source by holding a stale copy of it.
#
# `dhmi` is a LIST because DHMİ renames airports and respells them:
#   Erzincan -> Erzincan Yıldırım Akbulut (2021)
#   Mardin   -> Mardin Prof. Dr. Aziz Sancar (2022)
#   Şanlıurfa GAP and Şanlıurfa Gap, the same airport in different years.
# Every name a year's table prints must appear here or the reader refuses: a
# new airport is a line in this file, never a row silently dropped from a map.
#
# DHMİ also marks privately operated airports with a trailing "(*)", and moved
# the space in front of it in 2022 ("İstanbul(*)" -> "İstanbul (*)"). The marker
# is stripped before the name is looked up; the footnote it refers to is about
# who operates the airport, not what it is called.
#
# Built 2026-09-20 by matching six years of DHMİ tables against OurAirports and
# reading every line. The two the matcher got wrong, and a human did not:
# "İstanbul" is LTFM, the airport that opened in 2019 — not Atatürk (LTBA),
# which DHMİ still lists on its own row with zeroes — and "Iğdır Şehit Bülent
# Aydın" is LTCT, not the Aydın Çıldır its name happens to contain.

version: 1
airports:
