# licences.yaml — every licence a source card may name.
#
# A card's `licence` must be a key here; atlas/core/registry.py refuses one that
# is not. `attribution` is the exact wording the licensor asks for — never a
# paraphrase. Each entry says when its terms were read, because a licence page
# with no date of its own can only be quoted as of a day someone looked at it.
#
# This project is personal and non-commercial. Where a publisher's terms forbid
# reproduction outright, its data is not reproduced here at all: the atlas links
# to it and reproduces an openly licensed alternative instead. KGM is the case
# that forced the rule (see docs/SOURCES.md).

licences:
  tuik-attribution:
    name: TÜİK terms of use
    url: https://www.tuik.gov.tr/Kurumsal/Yasal_Uyari
    redistribution: permitted with attribution
    # Read 2026-09-19, verbatim: "İnternet sitemizden, yayınlarımızdan veya veri
    # tabanlarımızdan elde edilen verilerin, kaynak gösterilmek suretiyle herhangi
    # bir izine gerek duymaksızın yeniden kullanımı mümkündür." — reuse is possible
    # without any permission, provided the source is shown. The page carries no
    # date of its own.
    attribution: Türkiye İstatistik Kurumu (TÜİK)

  ysk-unstated:
    name: YSK Açık Veri Portalı — no published terms
    url: https://acikveri.ysk.gov.tr/
    redistribution: unstated by the publisher
    # Checked 2026-09-20: the portal publishes election results through a public,
    # unauthenticated API and states no terms of use anywhere on it. Recorded as
    # unstated rather than assumed permissive.
    attribution: Yüksek Seçim Kurulu (YSK)

  dhmi-unstated:
    name: DHMİ — no published terms
    url: https://www.dhmi.gov.tr/Sayfalar/Istatistikler.aspx
    redistribution: unstated by the publisher
    # Checked 2026-09-20: DHMİ publishes its airport statistics as monthly
    # workbooks on an open page and states no terms of use anywhere on the site
    # — the only policy it publishes is a KVKK notice, which is about personal
    # data and not about reusing statistics. The page does say the figures are
    # "Resmi İstatistik Programı (RİP) Kapsamındadır", part of the Official
    # Statistics Programme; that is a statement about how they are produced,
    # not a licence, so it is recorded here rather than read as permission.
    attribution: Devlet Hava Meydanları İşletmesi (DHMİ)

  ibb-open-data:
    name: İstanbul Büyükşehir Belediyesi Açık Veri Lisansı
    url: https://data.ibb.gov.tr/license
    redistribution: permitted, commercially and non-commercially, with attribution
    # Read 2026-09-20. The licence grants a worldwide, royalty-free, perpetual,
    # non-exclusive licence to "Bilgileri kopyalamak, yayınlamak, dağıtmak ve
    # iletmek" (copy, publish, distribute and transmit), "Bilgiyi uyarlamak"
    # (adapt it) and use it "ticari olarak ve ticari olmayan şekilde"
    # (commercially and non-commercially), on the condition that the source is
    # referenced. Where the provider states no wording of its own it prescribes:
    # "Atıf 4.0 Uluslararası (CC BY 4.0) kapsamında lisanslanan kamu sektörü
    # bilgilerini içerir." Modelled on the UK Open Government Licence.
    attribution: İstanbul Büyükşehir Belediyesi (İBB) Açık Veri Portalı

  nasa-cc0:
    name: NASA Earthdata — CC0, with acknowledgement asked
    url: https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-policy
    redistribution: permitted; NASA asks to be acknowledged as the source
    # Read 2026-09-21, verbatim: "Unless the content is marked with a use
    # restriction or license, data provided from a NASA-led mission are licensed
    # as Creative Commons Zero (CC0). While there are no restrictions on the use
    # of these data, data users are very strongly urged to cite the data used in
    # their work products." And: "NASA should be acknowledged as the source of
    # the material." Suomi NPP is a NASA-led mission.
    attribution: NASA Earth Observing System Data and Information System (EOSDIS) GIBS

  boc-terms-of-use:
    name: Bank of Canada Terms of Use
    url: https://www.bankofcanada.ca/terms/
    redistribution: permitted with attribution
    # Read 2026-09-21. Under "1. Copyright / Permission to Reproduce", except for
    # bank note images and the Bank's own logo, "the Bank permits you to freely
    # use, copy, distribute and transmit its website content" — on the conditions
    # that the Bank is attributed as the source and that changes are indicated
    # (1.1), that due diligence is exercised over the accuracy of anything
    # reproduced (1.2), and that content provided through a paid service says it
    # is available free on the Bank's own site (1.3). This atlas reproduces one
    # number per year from one series, attributes it, and is not sold.
    attribution: Bank of Canada

  geoboundaries-open:
    name: geoBoundaries gbOpen — Creative Commons Attribution-ShareAlike 2.0
    url: https://www.geoboundaries.org/index.html#usage
    redistribution: permitted with attribution and share-alike
    # Read 2026-09-21 from geoBoundaries' own API for TUR/ADM1, which returns
    # boundaryLicense "Creative Commons Attribution-ShareAlike 2.0" and
    # licenseSource www.openstreetmap.org/copyright — so the upstream is
    # OpenStreetMap and the share-alike is the same obligation odbl-1.0 carries.
    # Recorded as its own entry rather than folded into odbl-1.0 because the
    # licence NAME geoBoundaries publishes is not ODbL, and a card must say what
    # its publisher says.
    attribution: geoBoundaries (geoLab, William & Mary), from © OpenStreetMap contributors

  odbl-1.0:
    name: Open Database License 1.0
    url: https://opendatacommons.org/licenses/odbl/1-0/
    redistribution: permitted with attribution and share-alike
    # OpenStreetMap contributors, via the Geofabrik Türkiye extract. Share-alike
    # binds derived databases, which is why OSM-derived geometry is published
    # here as its own files rather than merged into other datasets.
    attribution: © OpenStreetMap contributors, ODbL 1.0

  public-domain:
    name: Public domain
    url: ""
    redistribution: permitted
    # Natural Earth and OurAirports both release to the public domain, each
    # stated on its own download page (read 2026-09-19).
    attribution: ""

  commons-per-file:
    name: Wikimedia Commons — per file
    url: https://commons.wikimedia.org/wiki/Commons:Licensing
    redistribution: per file; each file's own licence and author are published beside it
    attribution: per file

  aisstream-unstated:
    name: aisstream.io — no published terms
    url: https://aisstream.io/
    redistribution: unstated by the publisher
    # Checked 2026-09-19: aisstream.io/terms is a 404 and the privacy policy
    # covers only personal data. Two requests for clarification on the project's
    # own issue tracker (#181, #289) are open and unanswered.
    attribution: aisstream.io
