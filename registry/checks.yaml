  rail-network:
    path: data/rail/network.json
    records: lines
    id_field: id
    geometry_path: line
    checks:
    - kind: unique_ids
      note: One record per line, keyed on the smallest OSM way id it was joined from.
    - kind: fields_present
      fields: [line, osm_ways, points]
      note: >-
        Every line carries its geometry, the OSM ways it was joined from — so the join can be undone —
        and how many points survived the simplification.
    - kind: geometry_within_region
      region: country
      tolerance_km: 5
      note: >-
        Every point of every line is inside Türkiye. The query asks Overpass for an area, and an area
        filter that silently failed would return the railways of a continent.

  rail-stations:
    path: data/rail/stations.json
    records: stations
    id_field: id
    geometry_path: point
    place_text_path: province.tr
    checks:
    - kind: unique_ids
      note: One record per OSM node.
    - kind: fields_present
      fields: [kind, point, placement]
      note: >-
        The published kind, the published coordinate, and how the province was decided. NOT the name:
        five of the 1 334 station nodes have none in OSM, and a station that exists without a name is
        published as it is rather than dropped for being awkward (CLAUDE.md §10).
    - kind: enum_field
      field: placement
      allowed: [contains, nearest, none]
      note: >-
        Every station says how it was placed: inside a published boundary, within two kilometres of one
        where the simplified boundary contains none, or not at all.
    - kind: geometry_within_region
      region: country
      tolerance_km: 5
      note: Every station's published coordinate is inside the country it was asked for.
    - kind: geometry_region_matches_text
      region: provinces
      severity: note
      note: >-
        The province this pipeline derived, recomputed here from the same published boundary — verify/
        never imports atlas/, so the two are independent. A station the boundary does not contain is
        skipped by this check and covered by `placement` instead.

  istanbul-transit:
    path: data/transit/istanbul.json
    records: routes
    id_field: id
    checks:
    - kind: unique_ids
      note: One record per route, keyed on İBB's own route_id.
    - kind: record_count
      expect: 123
      note: >-
        The metro, tram, funicular, cable car and ferry routes in the feed. The other 376 are minibüs
        and taxi-dolmuş, which this dataset says it does not include.
    - kind: fields_present
      fields: [short_name, long_name, mode, mode_label.tr, trips, stops, shapes]
      note: >-
        Both published names, the mode, the count of trips the feed schedules, the stops it calls at
        and the geometry it follows. A route with no stops or no shape would draw as nothing.
    - kind: enum_field
      field: mode
      allowed: [metro, tram, ferry, funicular, cable_car]
      note: >-
        Five modes and five validated palette slots. A sixth would have to be a decision about colour
        before it could be a line on the map (CLAUDE.md §9).

  istanbul-transit-stops:
    path: data/transit/istanbul.json
    records: stops
    id_field: id
    geometry_path: point
    checks:
    - kind: unique_ids
      note: One record per stop, keyed on İBB's own stop_id.
    - kind: fields_present
      fields: [name, point]
      note: Every stop has the name and the coordinate the feed publishes for it.
    - kind: geometry_within_region
      region: country
      tolerance_km: 2
      note: >-
        Every stop is inside Türkiye. This was ten kilometres until 2026-09-21, and the ten was the
        boundary's fault rather than the feed's: Natural Earth admin-1 at 8% reduced İstanbul to two
        polygons of 13 and 9 points and had no Princes' Islands at all, so the piers at Büyükada,
        Heybeliada, Burgazada and Kınalıada sat 6 to 8 km outside a coastline that did not include
        the islands they are on. The boundaries are geoBoundaries' now and the islands are in them,
        so the tolerance is back to what a pier on a quay actually needs.

  places-settlements:
    path: data/places/settlements.json
    records: places
    id_field: id
    geometry_path: point
    place_text_path: province.tr
    checks:
    - kind: unique_ids
      note: One record per OSM node, and no node twice.
    - kind: fields_present
      fields: [name.tr, kind, plaka, point, province.tr]
      note: >-
        A name, a class, the province it was placed in and the coordinate it was placed by. A
        settlement with no name is a dot the base layer cannot label, which is the one thing this
        layer is for.
    - kind: enum_field
      field: kind
      allowed: [city, town]
      note: >-
        The two OSM classes this dataset asks for. `village` would be 35 000 more of them and is not
        a label layer; a third class appearing here means the query changed.
    - kind: geometry_within_region
      region: country
      tolerance_km: 2
      note: >-
        Every settlement is inside Türkiye. The query asks OSM for nodes inside the country, so a
        point outside it means the area filter matched something else — which is the failure mode an
        empty Overpass answer shares, and the one worth catching.
    - kind: geometry_region_matches_text
      region: provinces
      note: >-
        The province this atlas published for a settlement is the province whose boundary contains
        its coordinate — recomputed here from the boundary file rather than taken from the pipeline's
        own answer. Measured 2026-09-21: all 1 005 were placed by containment and none by proximity,
        which is the detail tier doing its job.

  nightlights-viirs:
    path: data/nightlights/viirs.json
    records: dates
    id_field: date
    checks:
    - kind: unique_ids
      note: One record per night offered, and no night twice.
    - kind: record_count
      at_least: 60
      note: >-
        A floor rather than a number, because this collection grows on its own: one night a month for
        the last five calendar years, plus one a year back to 2012, so an exact count would fail on
        the first of every month and mean nothing. Sixty is below any month's total and far above an
        empty or collapsed answer, which is the failure worth catching.
    - kind: fields_present
      fields: [year, stands_for, grain, period, tile, tile_bytes, tile_sha256]
      note: >-
        The period it stands for and how long that period is, the published interval it falls in, the
        tile fetched as proof, and what came back.
    - kind: enum_field
      field: grain
      allowed: [month, year]
      note: >-
        The two rules that choose a night. A third value would mean a stop nobody decided on.
    - kind: date_in_declared_ranges
      field: date
      ranges_path: layer.periods
      note: >-
        Every night this atlas offers is inside one of the intervals NASA's own capabilities document
        publishes for the layer — recomputed here from those intervals, not taken from the field the
        pipeline wrote beside them. A date the service does not hold is a black map with no error.
    - kind: numeric_at_least
      field: tile_bytes
      minimum: 1000
      note: >-
        Each proof tile is a real PNG rather than an empty answer. This is the only layer whose
        imagery the reader's browser fetches live, so "the date works" has to be checked here.
