  rail-network:
    path: data/rail/network.json
    records: lines
    id_field: id
    geometry_path: line
    checks:
    - kind: unique_ids
      note: One record per line, keyed on the smallest OSM way id it was joined from.
    - kind: fields_present
      fields: [line, osm_ways, points]
      note: >-
        Every line carries its geometry, the OSM ways it was joined from — so the join can be undone —
        and how many points survived the simplification.
    - kind: geometry_within_region
      region: country
      tolerance_km: 5
      note: >-
        Every point of every line is inside Türkiye. The query asks Overpass for an area, and an area
        filter that silently failed would return the railways of a continent.

  rail-stations:
    path: data/rail/stations.json
    records: stations
    id_field: id
    geometry_path: point
    place_text_path: province.tr
    checks:
    - kind: unique_ids
      note: One record per OSM node.
    - kind: fields_present
      fields: [kind, point, placement]
      note: >-
        The published kind, the published coordinate, and how the province was decided. NOT the name:
        five of the 1 334 station nodes have none in OSM, and a station that exists without a name is
        published as it is rather than dropped for being awkward (CLAUDE.md §10).
    - kind: enum_field
      field: placement
      allowed: [contains, nearest, none]
      note: >-
        Every station says how it was placed: inside a published boundary, within two kilometres of one
        where the simplified boundary contains none, or not at all.
    - kind: geometry_within_region
      region: country
      tolerance_km: 5
      note: Every station's published coordinate is inside the country it was asked for.
    - kind: geometry_region_matches_text
      region: provinces
      severity: note
      note: >-
        The province this pipeline derived, recomputed here from the same published boundary — verify/
        never imports atlas/, so the two are independent. A station the boundary does not contain is
        skipped by this check and covered by `placement` instead.

  istanbul-transit:
    path: data/transit/istanbul.json
    records: routes
    id_field: id
    checks:
    - kind: unique_ids
      note: One record per route, keyed on İBB's own route_id.
    - kind: record_count
      expect: 123
      note: >-
        The metro, tram, funicular, cable car and ferry routes in the feed. The other 376 are minibüs
        and taxi-dolmuş, which this dataset says it does not include.
    - kind: fields_present
      fields: [short_name, long_name, mode, mode_label.tr, trips, stops, shapes]
      note: >-
        Both published names, the mode, the count of trips the feed schedules, the stops it calls at
        and the geometry it follows. A route with no stops or no shape would draw as nothing.
    - kind: enum_field
      field: mode
      allowed: [metro, tram, ferry, funicular, cable_car]
      note: >-
        Five modes and five validated palette slots. A sixth would have to be a decision about colour
        before it could be a line on the map (CLAUDE.md §9).

  istanbul-transit-stops:
    path: data/transit/istanbul.json
    records: stops
    id_field: id
    geometry_path: point
    checks:
    - kind: unique_ids
      note: One record per stop, keyed on İBB's own stop_id.
    - kind: fields_present
      fields: [name, point]
      note: Every stop has the name and the coordinate the feed publishes for it.
    - kind: geometry_within_region
      region: country
      tolerance_km: 10
      note: >-
        Every stop is inside Türkiye — at ten kilometres, and the number is the boundary's fault
        rather than the feed's. Natural Earth admin-1 simplified to 8% reduces İstanbul to two
        polygons of 13 and 9 points and loses the Princes' Islands altogether, so the ferry piers at
        Büyükada, Heybeliada, Burgazada and Kınalıada sit 6 to 8 km outside a coastline that does not
        include the islands they are on. The stops are where İBB says they are.

  nightlights-viirs:
    path: data/nightlights/viirs.json
    records: dates
    id_field: date
    checks:
    - kind: unique_ids
      note: One record per night offered, and no night twice.
    - kind: record_count
      expect: 15
      note: >-
        One night a year from 2012 to the newest the layer publishes. The number grows by one each
        January, which is a change worth making deliberately.
    - kind: fields_present
      fields: [year, period, tile, tile_bytes, tile_sha256]
      note: >-
        The year it stands for, the published period it falls in, the tile fetched as proof, and what
        came back.
    - kind: date_in_declared_ranges
      field: date
      ranges_path: layer.periods
      note: >-
        Every night this atlas offers is inside one of the intervals NASA's own capabilities document
        publishes for the layer — recomputed here from those intervals, not taken from the field the
        pipeline wrote beside them. A date the service does not hold is a black map with no error.
    - kind: numeric_at_least
      field: tile_bytes
      minimum: 1000
      note: >-
        Each proof tile is a real PNG rather than an empty answer. This is the only layer whose
        imagery the reader's browser fetches live, so "the date works" has to be checked here.
