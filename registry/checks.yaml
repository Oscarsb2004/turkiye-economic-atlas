# checks.yaml — verification declared, not coded (verify/checks.py).
#
# Each entry names a dataset's published file, the list of records inside it,
# the field that identifies a record, and the checks to run. The kinds live in
# verify/checks.py's KINDS table, so covering a new dataset is an entry here
# rather than a branch in Python.
#
# `regions` names geometry a geometry_within_region check may refer to.

version: 1

regions:
  country:
    file: web/public/geo/turkiye.json
    label: Türkiye
  provinces:
    file: web/public/geo/provinces.json
    name_fields: [name_tr, name_en]

datasets:
  province-gdp-per-capita:
    path: data/provinces/gdp-per-capita.json
    records: provinces
    id_field: plaka
    checks:
    - kind: unique_ids
      note: One record per province, and no province twice.
    - kind: record_count
      expect: 81
      note: All 81 il. A province missing here is a hole in every overlay keyed on the plaka code.
    - kind: fields_present
      fields: [nuts3, name.tr, name.en, per_capita_gdp.TRY, per_capita_gdp.USD]
      note: Both currencies TÜİK publishes, and the İBBS code the workbook was joined on.
  election-2023-cumhurbaskani-1:
    path: data/elections/2023-cumhurbaskani-1.json
    records: provinces
    id_field: plaka
    checks:
    - kind: unique_ids
      note: One record per province, and no province twice.
    - kind: record_count
      expect: 81
      note: All 81 il. Presidential election, first round.
    - kind: fields_present
      fields: [name.tr, votes, turnout.registered, turnout.voted, turnout.valid, turnout.invalid, provenance]
      note: Every province carries its votes, the turnout YSK publishes beside them, and how it was obtained.
    - kind: map_sums_to_published_total
      map_field: votes
      totals_path: published_total.votes
      note: >-
        The 81 provinces sum to YSK's own national row, for each of the 4 ballot
        options. This is what catches a province filed under the wrong plaka, a column read
        as the wrong option, or an electoral district double-counted where a province is split.
    - kind: map_sums_to_published_total
      map_field: turnout
      totals_path: published_total.turnout
      note: Registered, voted, valid and invalid likewise.

  election-2023-cumhurbaskani-2:
    path: data/elections/2023-cumhurbaskani-2.json
    records: provinces
    id_field: plaka
    checks:
