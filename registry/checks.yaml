    id_field: plaka
    checks:
    - kind: unique_ids
      note: One record per province, and no province twice.
    - kind: record_count
      expect: 81
      note: All 81 il. Parliamentary general election.
    - kind: fields_present
      fields: [name.tr, votes, turnout.registered, turnout.voted, turnout.valid, turnout.invalid, provenance]
      note: Every province carries its votes, the turnout YSK publishes beside them, and how it was obtained.
    - kind: map_sums_to_published_total
      map_field: votes
      totals_path: published_total.votes
      note: >-
        The 81 provinces sum to YSK's own national row, for each of the 29 ballot
        options. This is what catches a province filed under the wrong plaka, a column read
        as the wrong option, or an electoral district double-counted where a province is split.
    - kind: map_sums_to_published_total
      map_field: turnout
      totals_path: published_total.turnout
      note: Registered, voted, valid and invalid likewise.

  elections-index:
    # What the time slider reads. The index is generated by the bundle from the
    # election files themselves, so a lost entry would not fail any election's
    # own gates — it would quietly remove a stop from the slider instead.
    path: web/public/data/elections/index.json
    records: elections
    id_field: slug
    checks:
    - kind: unique_ids
      note: One entry per election, and no election twice.
    - kind: record_count
      expect: 3
      note: Every election published today has a stop on the slider. Adding one moves this number.
    - kind: fields_present
      fields: [date, title.tr]
      note: A stop is labelled with the date and the Turkish title the pipeline published (CLAUDE.md §2b).

  migration-2020:
    path: data/migration/2020.json
    records: provinces
    id_field: plaka
    checks:
    - kind: unique_ids
      note: One record per province, and no province twice.
    - kind: record_count
      expect: 81
      note: All 81 il. Every province both sends and receives, so a missing one is a hole in the matrix.
    - kind: fields_present
      fields: [name.tr, population, out]
      note: The name, the population TÜİK published for 2020, and the flows out of the province.
    - kind: flow_totals
      map_field: out
      totals_path: totals.by_plaka
      note: >-
        The 6 480 published flows, added up here rather than trusted: every destination is one of the 81
        and never the province itself, and each province's own flows reproduce the received, given and net
        totals the pipeline derived. For 2020 the same addition reproduces TÜİK's own published headline.

